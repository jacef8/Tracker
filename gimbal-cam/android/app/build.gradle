plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.groundlink.gimbalcam'
    compileSdk 35

    defaultConfig {
        applicationId 'com.groundlink.gimbalcam'
        // CameraX Recorder pause()/resume() needs API 24.
        minSdk 24
        targetSdk 35
        versionCode 3
        versionName '1.0.2'
    }

    signingConfigs {
        // Same public debug-grade key GroundLink sideloads with (password 'android', committed
        // on purpose), so a PC build and a CI build install over each other without a
        // signature conflict.
        glsign {
            storeFile file('../../../native-app/android/app/groundlink.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.glsign
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.glsign
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

dependencies {
    def camerax = '1.4.2'
    implementation "androidx.camera:camera-core:$camerax"
    implementation "androidx.camera:camera-camera2:$camerax"
    implementation "androidx.camera:camera-lifecycle:$camerax"
    implementation "androidx.camera:camera-video:$camerax"
    implementation "androidx.camera:camera-view:$camerax"

    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity-ktx:1.9.3'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
}
