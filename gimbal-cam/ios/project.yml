# XcodeGen spec: `xcodegen generate` turns this into GimbalCam.xcodeproj (CI does it; the
# generated project is not committed).
name: GimbalCam
options:
  bundleIdPrefix: com.groundlink
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: XM3MLRA366
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  GimbalCam:
    type: application
    platform: iOS
    sources:
      - GimbalCam
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.groundlink.gimbalcam
        PRODUCT_NAME: GimbalCam
        INFOPLIST_FILE: GimbalCam/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
schemes:
  GimbalCam:
    build:
      targets:
        GimbalCam: all
    archive:
      config: Release
