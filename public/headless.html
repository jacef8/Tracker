<!DOCTYPE html>
<html>
<head><meta charset="UTF-8" /><title>GroundLink Background</title></head>
<body>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getDatabase, ref, set, push, get } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
  import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

  // Minimal, UI-less location reporter — hosted inside HeadlessTrackerService (native Android)
  // in its own bare WebView, independent of MainActivity/the Capacitor bridge. Exists because
  // the main app's location fan-out (onGpsFix in index.html) only ever runs while a Capacitor
  // Activity is alive — swiping the app from Recents (or a device reboot before the app is ever
  // reopened) tears that down entirely, and the vendored background-geolocation plugin
  // deliberately stops itself the moment that Activity/bridge is destroyed (see
  // BackgroundGeolocationService.onUnbind / BackgroundGeolocation.handleOnDestroy). This page
  // re-implements just the one piece that has to survive without any of that: reading the
  // fan-out target list (Favorites/Crews/tracked quick-join rooms) from the SAME shared
  // localStorage the real app already writes to, and writing GPS fixes to Firebase for each.
  // It does not replace the main app, has no map/chat/voice/UI, and is never opened by a human.
  const firebaseConfig = {
    apiKey:            "AIzaSyCD_6FEd8wJQszvE1DVAZtko1smZVlhCpk",
    authDomain:        "tracker-58b87.firebaseapp.com",
    databaseURL:       "https://tracker-58b87-default-rtdb.firebaseio.com",
    projectId:         "tracker-58b87",
    storageBucket:     "tracker-58b87.firebasestorage.app",
    messagingSenderId: "371034128407",
    appId:             "1:371034128407:web:31259f67dc2d36d91cdc52",
    measurementId:     "G-EH3FZ2CZWJ"
  };
  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const auth = getAuth(app);

  function log(msg) { try { console.log('[GL-headless] ' + msg); } catch (e) {} }

  function getUid() { try { return localStorage.getItem('gl_uid') || ''; } catch (e) { return ''; } }
  function getName() { try { return localStorage.getItem('gl_name') || 'Someone'; } catch (e) { return 'Someone'; } }
  function getDev() { try { return localStorage.getItem('gl_devlabel') || ''; } catch (e) { return ''; } }
  // Same key index.html's _setMyColor() writes. Without this, a background fix (fbSet fully
  // replaces the node, no merge) silently erases whatever color the person picked on the
  // Account page the moment the native service writes its next fix.
  function getMyColor() { try { return localStorage.getItem('gl_mycolor') || ''; } catch (e) { return ''; } }
  function getFavs() { try { return JSON.parse(localStorage.getItem('gl_favs') || '[]'); } catch (e) { return []; } }
  function getCircles() { try { return JSON.parse(localStorage.getItem('gl_circles') || '{}'); } catch (e) { return {}; } }
  function getJoined() { try { return JSON.parse(localStorage.getItem('gl_joined') || '{}'); } catch (e) { return {}; } }
  function setJoined(m) { try { localStorage.setItem('gl_joined', JSON.stringify(m)); } catch (e) {} }
  // Same key index.html's _setToggleHistory() writes — this page has no access to that page's
  // JS state, so it reads the flag straight from the SAME shared localStorage.
  function getHistoryOn() { try { return localStorage.getItem('gl_history_on') === '1'; } catch (e) { return false; } }

  function metersApart(lat1, lng1, lat2, lng2) {
    var R = 6371000;
    var dLat = (lat2 - lat1) * Math.PI / 180;
    var dLng = (lng2 - lng1) * Math.PI / 180;
    var a = Math.sin(dLat / 2) ** 2 + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLng / 2) ** 2;
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
  }
  // Same filtering thresholds as index.html's history write (onGpsFix) — kept in sync manually
  // since this page can't share code with the main app.
  var HIST_MAX_ACC_M = 50, HIST_MAX_MPH = 150, HIST_MIN_DIST_M = 50;
  var lastHistoryPos = null, lastHistoryTs = 0;

  // "Here since" — mirrors index.html's onGpsFix anchor so the "Here for Xm"/"Moving" label
  // stays correct across background fixes too (not just foreground ones).
  var hereAnchor = null, hereSinceTs = 0;
  var HERE_MOVE_M = 40;

  // Recomputed fresh on every single fix (not cached at startup) — favoriting a room or
  // accepting a Crew invite in the VISIBLE app while this headless instance also happens to be
  // running takes effect on the very next fix, no restart needed, since both share localStorage.
  // Self-prunes expired quick-join entries the same way onGpsFix's fan-out loop already does.
  function fanOutKeys() {
    var keys = {};
    getFavs().forEach(function (k) { keys[k] = 1; });
    Object.keys(getCircles()).forEach(function (k) { keys[k] = 1; });
    var joined = getJoined(), now = Date.now(), changed = false;
    Object.keys(joined).forEach(function (k) {
      var entry = joined[k];
      if (entry && entry.expires && now > entry.expires) { delete joined[k]; changed = true; return; }
      keys[k] = 1;
    });
    if (changed) setJoined(joined);
    return Object.keys(keys);
  }

  // Battery cache — mirrors index.html's _battWatch (this page shares no code with it).
  try {
    if (navigator.getBattery) navigator.getBattery().then(function (b) {
      var up = function () { window._batt = { pct: Math.round(b.level * 100), chg: !!b.charging }; };
      up(); b.addEventListener('levelchange', up); b.addEventListener('chargingchange', up);
    }).catch(function () {});
  } catch (e) {}

  // Stationary heartbeat state — see the interval below the start() call.
  var _lastFixCache = null, _lastWriteTs = 0;

  function onFix(pos) {
    var uid = getUid();
    if (!uid) return; // never used the real app on this device — nothing to report or fan out to
    // Cache for the heartbeat. Speed is nulled in the replay copy: a cached 40 mph re-sent
    // three minutes later would reset the here-since anchor and show phantom motion.
    try { _lastFixCache = { coords: { latitude: pos.coords.latitude, longitude: pos.coords.longitude, accuracy: pos.coords.accuracy, speed: null } }; _lastWriteTs = Date.now(); } catch (e) {}
    var keys = fanOutKeys();
    if (!keys.length) return;
    var c = pos.coords;
    // Doppler speed when the fix has one, else distance-over-time from the previous fix —
    // Android fixes intermittently arrive with speed:null mid-drive, and writing 0 for
    // those made the map's speed chip blink off and on while actually moving.
    var spdMph = 0;
    if (c.speed != null && c.speed >= 0) {
      spdMph = Math.round(c.speed * 2.23694);
    } else if (window._prevHlFix) {
      var _dsec = (Date.now() - window._prevHlFix.ts) / 1000;
      if (_dsec > 0.4) spdMph = Math.round((metersApart(window._prevHlFix.lat, window._prevHlFix.lng, c.latitude, c.longitude) / _dsec) * 2.23694);
    }
    if (spdMph > 200) spdMph = 0; // implausible — drop it
    window._prevHlFix = { lat: c.latitude, lng: c.longitude, ts: Date.now() };
    var hereMovedM = hereAnchor ? metersApart(hereAnchor.lat, hereAnchor.lng, c.latitude, c.longitude) : Infinity;
    if (spdMph >= 3 || hereMovedM > HERE_MOVE_M || !hereSinceTs) {
      hereAnchor = { lat: c.latitude, lng: c.longitude }; hereSinceTs = Date.now();
    }
    var payload = {
      lat: c.latitude, lng: c.longitude, name: getName(), dev: getDev(),
      accuracy: Math.round((c.accuracy || 0) * 3.28084), ts: Date.now(),
      // spdH mirrors the app's share-speed setting (same-origin localStorage). It was
      // hardcoded to 1 (hidden) here, so every background write hid the speed chip while
      // every foreground write showed it — alternating writers made it blink mid-drive.
      spd: spdMph, spdH: (function () { try { return localStorage.getItem('gl_share_speed') !== '0' ? 0 : 1; } catch (e) { return 0; } })(), rest: 0, hereSince: hereSinceTs, color: getMyColor()
    };
    // Same battery ride-along as index.html's _fixPayload — a stale dot's last report should
    // say whether the phone was dying, and background fixes are exactly the ones that go stale.
    try { if (window._batt) { payload.batt = window._batt.pct; payload.chg = window._batt.chg ? 1 : 0; } } catch (e) {}
    keys.forEach(function (k) {
      try { set(ref(db, 'gl/' + k + '/users/' + uid), payload); } catch (e) {}
    });
    // Low-battery Crew alert from the background path too — a dying phone is precisely the
    // one whose foreground app isn't open. Same edge logic and the SAME localStorage flag as
    // index.html, so the two paths can't double-send for one discharge cycle.
    try {
      if (window._batt) {
        var blSent = localStorage.getItem('gl_lowbatt_sent') === '1';
        if (window._batt.chg || window._batt.pct >= 30) {
          if (blSent) localStorage.setItem('gl_lowbatt_sent', '0');
        } else if (window._batt.pct <= 15 && !blSent) {
          localStorage.setItem('gl_lowbatt_sent', '1');
          Object.keys(getCircles()).forEach(function (ck) {
            fetch('/push', { method: 'POST', headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ ns: 'gl', group: ck, type: 'battlow', title: 'Low battery',
                body: (getName() || 'Someone') + "'s phone is at " + window._batt.pct + '% and not charging',
                url: '/', toFavs: true, senderId: uid,
                senderFcm: (function(){ try { return localStorage.getItem('gl_fcm') || ''; } catch(e){ return ''; } })(),
                senderEndpoint: (function(){ try { return localStorage.getItem('gl_push_endpoint') || ''; } catch(e){ return ''; } })() })
            }).catch(function () {});
          });
        }
      }
    } catch (e) {}
    writeHistoryIfOn(uid, c);
    checkPlaceGeofences(uid, c);
  }

  // Place Alerts — mirrors index.html's _checkPlaceGeofences (onGpsFix). Circle-scoped only.
  // This file has no live onValue subscriptions (kept deliberately minimal), so places are
  // cached with a short TTL and re-fetched with a one-shot get() rather than a standing
  // subscription — acceptable since fixes reaching this page are already infrequent (every
  // ~30s-3min in the background), so a few minutes of place-list staleness doesn't matter.
  var PLACE_HYSTERESIS_M = 15;
  var PLACE_MIN_TRANSITION_MS = 3 * 60 * 1000;
  var PLACE_MAX_TRUST_ACC_M = 150;
  var placesCache = {}, placesCacheTs = {};
  var placeGeoState = {}; // 'uid_placeId' -> {inside: bool|null}
  var PLACES_CACHE_TTL_MS = 5 * 60 * 1000;
  function getPlacesForCircle(circleKey) {
    var now = Date.now();
    if (placesCache[circleKey] && (now - (placesCacheTs[circleKey] || 0)) < PLACES_CACHE_TTL_MS) {
      return Promise.resolve(placesCache[circleKey]);
    }
    return get(ref(db, 'gl/' + circleKey + '/places')).then(function (snap) {
      var val = snap.val() || {};
      placesCache[circleKey] = val;
      placesCacheTs[circleKey] = now;
      return val;
    }).catch(function () { return placesCache[circleKey] || {}; });
  }
  function sendPlacePush(circleKey, kind, placeName) {
    try {
      var name = getName() || 'Someone';
      var body = name + (kind === 'arrive' ? ' arrived at ' : ' left ') + (placeName || 'a place');
      // toFavs required — circle members' push subs live only in favSubs, not pushSubs (see
      // _registerFavSub in index.html). Without this the server finds zero recipients.
      // senderId/senderFcm/senderEndpoint identify THIS device so the server won't notify it
      // about its own transition. They were missing entirely here, and all three of the
      // server's self-skip checks depend on them — an absent senderId compares equal to
      // nothing, so `uid === senderId` never matched and the empty token/endpoint short-
      // circuited the other two. The result: your own phone buzzing "Jace left Home" about
      // itself, but ONLY when the transition happened in the background, since the foreground
      // path (index.html pushNotify) always sent these. Confirmed from gl/_debug/lastPlacePush
      // on 2026-07-28: senderId "", decisions "TgfQdKOe9m:SENT-fcm".
      var _sid = getUid();
      var _fcm = ''; try { _fcm = localStorage.getItem('gl_fcm') || ''; } catch (e) {}
      var _ep  = ''; try { _ep  = localStorage.getItem('gl_push_endpoint') || ''; } catch (e) {}
      fetch('/push', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ ns: 'gl', group: circleKey, type: 'place_' + kind, title: placeName || 'Place alert', body: body, url: '/', toFavs: true,
                               senderId: _sid, senderFcm: _fcm, senderEndpoint: _ep })
      }).catch(function () {});
    } catch (e) {}
  }
  function checkPlaceGeofences(uid, c) {
    var circleKeys = Object.keys(getCircles());
    if (!circleKeys.length) return;
    var accM = c.accuracy || 0;
    circleKeys.forEach(function (circleKey) {
      getPlacesForCircle(circleKey).then(function (places) {
        Object.keys(places).forEach(function (placeId) {
          var p = places[placeId]; if (!p || typeof p.lat !== 'number') return;
          // Mirrors index.html's _checkPlaceGeofences accuracy guard — a fix this noisy can't
          // judge a geofence at all (common for a tablet on weak GPS indoors/poor sky view).
          if (accM > PLACE_MAX_TRUST_ACC_M) return;
          var dist = metersApart(c.latitude, c.longitude, p.lat, p.lng);
          var radius = p.radius || 200;
          var stateKey = uid + '_' + placeId;
          var state = placeGeoState[stateKey] || { inside: null, ts: 0 };
          var hyst = Math.max(PLACE_HYSTERESIS_M, accM * 0.75);
          var isInside;
          if (state.inside === true) isInside = dist <= radius + hyst;
          else if (state.inside === false) isInside = dist <= radius - hyst;
          else isInside = dist <= radius;
          var firstCheck = state.inside === null;
          if (!firstCheck && isInside !== state.inside && (Date.now() - (state.ts || 0)) < PLACE_MIN_TRANSITION_MS) return;
          placeGeoState[stateKey] = { inside: isInside, ts: (firstCheck || isInside !== state.inside) ? Date.now() : (state.ts || 0) };
          if (firstCheck || isInside === state.inside) return;
          var kind = isInside ? 'arrive' : 'leave';
          if (p.alertOn && p.alertOn[kind] === false) return;
          try {
            var evRef = push(ref(db, 'gl/' + circleKey + '/placeEvents'));
            set(evRef, { uid: uid, name: getName() || 'Someone', placeId: placeId, placeName: p.name || 'a place', kind: kind, ts: Date.now() });
          } catch (e) {}
          sendPlacePush(circleKey, kind, p.name);
        });
      });
    });
  }

  // Mirrors index.html's history-write block inside onGpsFix — kept as a near-duplicate rather
  // than shared code since this page can't import from the main app. Circle-scoped only (not
  // favorites/joined-rooms), same as the main app's write.
  function writeHistoryIfOn(uid, c) {
    if (!getHistoryOn()) return;
    var circleKeys = Object.keys(getCircles());
    if (!circleKeys.length) return;
    var accM = c.accuracy || 0;
    if (!(accM > 0 && accM <= HIST_MAX_ACC_M)) return; // bad fix — skip
    var now = Date.now();
    var distM = lastHistoryPos ? metersApart(lastHistoryPos.lat, lastHistoryPos.lng, c.latitude, c.longitude) : Infinity;
    if (!(distM > HIST_MIN_DIST_M)) return; // hasn't moved enough yet
    if (lastHistoryPos && lastHistoryTs) {
      var dtSec = Math.max(1, (now - lastHistoryTs) / 1000);
      var mph = (distM / dtSec) * 2.23694;
      if (mph > HIST_MAX_MPH) return; // implausible jump — bad fix
    }
    lastHistoryPos = { lat: c.latitude, lng: c.longitude };
    lastHistoryTs = now;
    var dateStr = new Date(now).toLocaleDateString('en-CA'); // yyyy-mm-dd, local date
    var point = { lat: c.latitude, lng: c.longitude, ts: now, acc: Math.round(accM) };
    circleKeys.forEach(function (k) {
      try {
        // glh/ top-level — mirrors index.html's move. History inside gl/ made the home screen's
        // whole-tree listener re-parse a mostly-history 1.5 MB tree on every write.
        var histRef = push(ref(db, 'glh/' + k + '/' + uid + '/' + dateStr));
        set(histRef, point);
      } catch (e) {}
    });
  }

  // iOS entry point: AppDelegate's CLLocationManager — unlike this page's own
  // navigator.geolocation.watchPosition below, which runs inside a WKWebView with no guaranteed
  // background execution — reliably keeps delivering fixes in the background via
  // significant-location-change monitoring (see AppDelegate.swift). It hands each fix to this
  // page via evaluateJavaScript instead of asking the WebView to acquire its own. Reuses onFix's
  // existing identity/fan-out/write logic completely unchanged; only the coordinate SOURCE
  // differs. Purely additive — does not touch the existing Android/watchPosition path at all.
  window._writeIOSFix = function (lat, lng, accuracy, speed) {
    onFix({ coords: { latitude: lat, longitude: lng, accuracy: accuracy || 0, speed: (speed != null && speed >= 0) ? speed : null } });
  };

  // Tells HeadlessTrackerService there's genuinely nothing to do, so its notification doesn't
  // linger forever for a device that was never really using this feature (a fresh install that
  // reboots before ever being opened once) or has since unfavorited/left everything it was
  // tracking. Safe to call repeatedly — the native side just stops the whole service.
  function stopIfNothingToDo() {
    if (!getUid() || !fanOutKeys().length) {
      try { if (window.AndroidHeadless) window.AndroidHeadless.stopSelf(); } catch (e) {}
      return true;
    }
    return false;
  }

  var started = false;
  function start() {
    if (started) return;
    if (stopIfNothingToDo()) { log('nothing to track — stopping'); return; }
    // iOS's AppDelegate keeps this exact page loaded for the app's entire process lifetime and
    // injects each fix directly via window._writeIOSFix (its own CLLocationManager is the
    // reliable background source there — a WKWebView's own internal geolocation bridge isn't
    // guaranteed the same background execution reliability). Starting ALSO watchPosition here
    // would just be a second, redundant, battery-costing GPS source competing with the native one
    // for the same writes over the page's whole (now much longer) lifetime. window._nativeDriven
    // is set via a WKUserScript before this script ever runs — see AppDelegate.swift.
    // Stationary heartbeat — the Android mirror of iOS's native staleFixTimer. watchPosition
    // is movement-gated, so a parked phone writes NOTHING and its dot goes stale overnight
    // even though the service is healthy (observed: 45 minutes of silence from a phone
    // sitting on a nightstand). Re-report the last known fix every 3 minutes so "parked and
    // fine" is distinguishable from "dead" — the exact gap already closed on iOS. Guarded on
    // _nativeDriven so the iOS instance (which has the native timer) can't double-report.
    setInterval(function () {
      try {
        if (window._nativeDriven || !_lastFixCache) return;
        if (Date.now() - _lastWriteTs < 170000) return;   // movement is already reporting
        onFix(_lastFixCache);
      } catch (e) {}
    }, 180000);
    if (window._nativeDriven) { log('native-driven (iOS) — skipping own watchPosition'); return; }
    if (!navigator.geolocation) { log('no geolocation API'); return; }
    started = true;
    navigator.geolocation.watchPosition(onFix, function (err) { log('geo error ' + err.code); },
      { enableHighAccuracy: true, maximumAge: 0, timeout: 30000 });
    log('watch started for uid ' + getUid());
    // Re-check periodically in case everything gets unfavorited/expires while this instance is
    // running long-term — the initial check above only covers the moment it started.
    setInterval(stopIfNothingToDo, 5 * 60 * 1000);
  }

  // Anonymous auth isn't strictly required for gl/ writes today (production rules currently
  // allow open writes there — only gltest/ enforces auth.uid match), but staying consistent with
  // the rest of the app future-proofs against the same tightening eventually reaching gl/ too,
  // and costs nothing to wait briefly for. Don't let a slow/broken auth path block tracking
  // forever, though — start anyway after a short grace period either way.
  try {
    onAuthStateChanged(auth, function (u) { if (u) start(); });
    if (!auth.currentUser) signInAnonymously(auth).catch(function (e) { log('anon auth failed: ' + e); });
  } catch (e) { log('auth init failed: ' + e); }
  setTimeout(start, 5000);
</script>
</body>
</html>
