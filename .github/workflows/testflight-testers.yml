name: TestFlight testers

# Manual only. "list" is read-only and sends nothing; "invite" sends real, unrecallable email
# to real people, so it is never the default and never runs automatically.
on:
  workflow_dispatch:
    inputs:
      action:
        description: "list/diagnose are read-only; invite and addgroup SEND real email"
        required: true
        default: list
        type: choice
        options: [verify, list, diagnose, builds, appstore, listing, publiclink, add, invite, addgroup, assignbuild]
      email:
        description: "tester email — required for diagnose and addgroup"
        required: false
        type: string
      all:
        description: "invite: also re-invite installed testers · publiclink: actually ENABLE the link"
        required: false
        default: false
        type: boolean

jobs:
  testers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT_BASE64 }}
        # Single quotes inside ${{ }} — GitHub Actions expressions reject double-quoted string
        # literals, and the whole workflow then fails to COMPILE: it loses its name, shows up by
        # filename, and every run dies in 0s with no useful error.
        run: |
          node tools/asc-testflight-testers.mjs "${{ inputs.action }}" "${{ inputs.email }}" ${{ inputs.all && (inputs.action == 'publiclink' && '--enable' || '--all') || '' }}
