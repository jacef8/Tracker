name: iOS TestFlight release

# Manual trigger only — this uploads a real build to App Store Connect, so it shouldn't
# fire on every push. Run it from the Actions tab when you want a new TestFlight build.
on:
  workflow_dispatch:
    inputs:
      lane:
        description: "beta = build + upload · distribute = hand an already-uploaded build to external testers"
        required: true
        default: beta
        type: choice
        options: [beta, distribute]
      changelog:
        description: "What to Test note (external distribution requires one)"
        required: false
        type: string

jobs:
  build-and-upload:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: native-app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: false

      - name: Install fastlane
        run: gem install fastlane -N

      - name: Install JS deps
        run: npm ci

      - name: Sync Capacitor iOS project (copies latest public/ web assets in)
        run: npx cap sync ios

      # Google sign-in setup changed 2026-07-30: the old :subspecs => ['Google'] mechanism
      # produced a pod that installed and passed this guard yet yielded NO importable module
      # and NO runtime plugin class — sign-in shipped dead while every check passed. Now the
      # Podfile carries a plain CapacitorFirebaseAuthentication pod, a direct GoogleSignIn pod
      # (inside the target block, which cap sync does not rewrite), and a post_install hook
      # injecting -DRGCFA_INCLUDE_GOOGLE. Guard all three pieces, then prove the lockfile.
      - name: Install CocoaPods
        run: |
          cd ios/App
          if ! grep -q "pod 'GoogleSignIn'" Podfile; then
            echo "::error::Podfile lost the direct GoogleSignIn pod — Google sign-in would be dead in this build."
            exit 1
          fi
          if ! grep -q "RGCFA_INCLUDE_GOOGLE" Podfile; then
            echo "::error::Podfile lost the RGCFA_INCLUDE_GOOGLE post_install flag — the plugin would build its Lite variant with Google sign-in compiled out."
            exit 1
          fi
          pod install --repo-update
          if ! grep -q "GoogleSignIn" Podfile.lock; then
            echo "::error::GoogleSignIn is absent from Podfile.lock — Google sign-in would be dead in this build."
            exit 1
          fi
          echo "GoogleSignIn linked: $(grep -m1 'GoogleSignIn' Podfile.lock)"

      # Decodes the distribution certificate (.p12) from GitHub secrets into a temporary CI
      # keychain, as Apple's own GitHub Actions guide recommends. The secret is never printed
      # or persisted outside this run.
      #
      # The provisioning profile is deliberately NOT installed from a secret any more. A
      # profile is a snapshot of the App ID's capabilities when it was generated, so a stored
      # one goes stale the instant an entitlement is added — which is exactly how the
      # associated-domains change broke this build. fastlane's sigh now fetches a fresh one
      # each run (see the Fastfile), so there is nothing here to rotate.
      - name: Install signing certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.IOS_DIST_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_DIST_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.IOS_CI_KEYCHAIN_PASSWORD }}
        run: |
          CERT_PATH=$RUNNER_TEMP/dist_cert.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo -n "$CERTIFICATE_BASE64" | base64 --decode -o "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/"//g')
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

      # Turn on every capability App.entitlements asks for, using the App Store Connect API
      # key already configured here. Without this, sigh below would happily regenerate a
      # profile that still lacks the capability and the build would fail the same way.
      # Idempotent — capabilities already enabled are skipped.
      - name: Enable required App ID capabilities
        working-directory: .
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT_BASE64 }}
        run: node tools/asc-enable-capabilities.mjs com.groundlink.ios ASSOCIATED_DOMAINS APPLE_ID_AUTH

      - name: Build and upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT_BASE64 }}
          BUILD_NUMBER: ${{ github.run_number }}
          LANE: ${{ inputs.lane || 'beta' }}
          CHANGELOG: ${{ inputs.changelog }}
        run: |
          cd ios/App
          fastlane "${LANE}"
