name: Gimbal Cam — Android APK

# Builds the Gimbal Cam APK and attaches it to the run as a downloadable artifact.
# Runs on any push that touches gimbal-cam/android/**, or by hand from the Actions tab.
on:
  workflow_dispatch:
  push:
    paths:
      - 'gimbal-cam/android/**'
      - '.github/workflows/gimbal-cam-android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gimbal-cam/android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # No setup-android step: ubuntu-latest already ships the Android SDK (ANDROID_HOME), and
      # android-actions/setup-android@v3 currently dies installing the retired 'tools' package.

      - name: Build APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: gimbal-cam-apk
          path: gimbal-cam/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
